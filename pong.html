<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pong Duo — Two-Screen Arena</title>
<style>
  :root{color-scheme:dark;--bg:#090f1e;--panel:#101b34;--border:#263659;--muted:#8390ad;--cyan:#67f5df;--pink:#ff72ad;--text:#f5fbff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;padding:10px;background:radial-gradient(circle at 50% 0,#152547 0,#070b16 70%);color:var(--text);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}
  .top-bar{width:min(100%,1120px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
  .brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand strong{font-size:14px;letter-spacing:.4px}
  .meta{color:var(--muted);font-size:12px}
  .actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  input,select,button{font:inherit;border-radius:9px;min-height:40px;padding:7px 11px;color:var(--text)}
  input,select{background:#091124;border:1px solid var(--border)}
  button{background:#182747;border:1px solid #354b7a;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
  button:active:not(:disabled){transform:scale(.98)}
  button:hover:not(:disabled){border-color:var(--cyan)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.primary{background:var(--cyan);color:#06131c;border-color:var(--cyan)}
  button.mode-active{background:var(--pink);color:#14060d;border-color:var(--pink)}
  button.online-laptop-active{background:#7ea8ff;color:#071024;border-color:#7ea8ff}
  button.is-muted{opacity:.65}
  .stage{width:min(100%,1120px);aspect-ratio:16/9;max-height:64dvh;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 18px 42px #000a;background:#090f1e;contain:layout style paint}
  .stage:fullscreen,.stage.pseudo-fs{position:fixed;inset:0;width:100vw;height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0;border:0;z-index:50}
  @media (max-width:720px) and (orientation:portrait){
    body{padding:8px;gap:6px}
    .top-bar{padding:7px 8px;gap:5px}
    input,select,button{min-height:36px;padding:5px 9px;font-size:12.5px}
    .stage{width:100%;aspect-ratio:4/5;max-height:66dvh;border-radius:12px}
    .touch-pad{gap:8px}
    .touch-btn{min-height:50px;font-size:14px}
  }
  .fs-exit-btn{display:none}
  .hud{position:absolute;top:10px;left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:2}
  .side-tag{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700}
  .side-tag.left-c{color:var(--cyan)}
  .side-tag.right-c{color:var(--pink)}
  .scoreboard{display:flex;align-items:center;gap:12px;font-size:clamp(22px,5vw,40px);font-weight:800;font-variant-numeric:tabular-nums}
  .scoreboard span:first-child{color:var(--cyan)}
  .scoreboard span:last-child{color:var(--pink)}
  canvas{width:100%;height:100%;display:block}
  .overlay{position:absolute;inset:0;background:#070c18f0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:8px;z-index:3}
  .overlay[hidden]{display:none}
  .kicker{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--cyan)}
  .overlay h2{margin:0;font-size:clamp(20px,4vw,34px)}
  .overlay p{margin:0 0 8px;color:var(--muted);max-width:420px;font-size:13px}
  .touch-pad{display:grid;width:100%;max-width:1120px;grid-template-columns:1fr 1fr;gap:10px}
  .touch-btn{min-height:54px;font-size:15px;font-weight:800;border-radius:12px;background:#13203d;border:1px solid #354b7a;color:var(--text)}
  .touch-btn.active{background:var(--cyan);color:#06131c;border-color:var(--cyan)}
</style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <strong>PONG DUO</strong>
      <span class="meta" id="statusLabel">Connecting…</span>
    </div>
    <div class="actions">
      <input id="roomInput" type="text" maxlength="12" style="width:78px" placeholder="Room">
      <button id="joinButton" type="button">Join</button>
      <button id="twoLaptopsButton" type="button">2 Laptops</button>
      <button id="onlineLaptopsButton" type="button">2 Online Laptops</button>
      <select id="viewSelect" aria-label="Court view">
        <option value="split" selected>Split Half</option>
        <option value="full">Full Court</option>
      </select>
      <button id="pauseButton" type="button"><span class="pause-symbol">Ⅱ</span> Pause</button>
      <button id="soundButton" type="button" class="is-muted" aria-label="Toggle sound">Sound</button>
      <button id="fullscreenButton" type="button" aria-label="Fullscreen">Fullscreen</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="hud">
      <div><div class="side-tag left-c">LEFT SCREEN</div></div>
      <div class="scoreboard">
        <span id="playerScore">0</span>
        <span style="color:var(--muted);font-size:.65em">:</span>
        <span id="cpuScore">0</span>
      </div>
      <div style="text-align:right"><div class="side-tag right-c">RIGHT SCREEN</div></div>
    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>

    <div class="overlay" id="overlay">
      <div class="kicker" id="overlayKicker">TWO-SCREEN LOBBY</div>
      <h2 id="overlayTitle">Waiting for Player 2…</h2>
      <p id="overlayText">Open /pong on the second screen and enter the same room code.</p>
      <button class="primary" id="overlayButton" type="button" disabled>SERVE BALL →</button>
    </div>
  </div>

  <div class="touch-pad" aria-label="Touch paddle controls">
    <button class="touch-btn" id="touchUp" type="button">▲ MOVE UP</button>
    <button class="touch-btn" id="touchDown" type="button">▼ MOVE DOWN</button>
  </div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const playerScoreEl = document.getElementById('playerScore');
  const cpuScoreEl = document.getElementById('cpuScore');
  const statusLabel = document.getElementById('statusLabel');
  const roomInput = document.getElementById('roomInput');
  const twoLaptopsButton = document.getElementById('twoLaptopsButton');
  const onlineLaptopsButton = document.getElementById('onlineLaptopsButton');
  const viewSelect = document.getElementById('viewSelect');
  const overlay = document.getElementById('overlay');
  const overlayKicker = document.getElementById('overlayKicker');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayButton = document.getElementById('overlayButton');
  const pauseButton = document.getElementById('pauseButton');
  const soundButton = document.getElementById('soundButton');
  const fullscreenButton = document.getElementById('fullscreenButton');
  const touchUp = document.getElementById('touchUp');
  const touchDown = document.getElementById('touchDown');

  const WIDTH = 2000;
  const HEIGHT = 600;
  const PADDLE_WIDTH = 12;
  const PADDLE_HEIGHT = 94;
  const BALL_RADIUS = 8;
  const WINNING_SCORE = 7;

  const isTouchOrSmall = window.matchMedia('(max-width: 720px) or (pointer: coarse)').matches;
  const lowPower = isTouchOrSmall || !!navigator.connection?.saveData || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
  const PADDLE_SEND_INTERVAL_MS = isTouchOrSmall ? 24 : 16;
  const TRAIL_LENGTH = lowPower ? 3 : 7;

  const courtGradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  courtGradient.addColorStop(0, '#0c1428');
  courtGradient.addColorStop(1, '#090f1e');

  let side = 'left';
  let playersCount = 1;
  let matchReady = false;
  let twoLaptopsMode = false;
  let onlineLaptopsMode = false;
  let ws = null;
  let lastPaddleSent = 0;
  let lastSentPaddleY = null;

  let playerScore = 0;
  let cpuScore = 0;
  let paused = false;
  let gameOver = false;
  let lastFrame = 0;
  let pointPause = 0;
  let soundEnabled = false;
  let audioContext;
  let holdUp = false;
  let holdDown = false;
  const keys = new Set();

  const player = { x: 30, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, speed: 450 };
  const cpu = { x: WIDTH - 30 - PADDLE_WIDTH, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, speed: 450 };
  const ball = { x: WIDTH / 2, y: HEIGHT / 2, vx: 0, vy: 0, speed: 430, trail: [], nextDirection: 1 };
  const remoteTarget = { py: player.y, cy: cpu.y, bx: ball.x, by: ball.y };

  roomInput.value = String(Math.floor(1000 + Math.random() * 9000));

  function usesNetwork() {
    return !twoLaptopsMode;
  }

  function playTone(frequency = 440, duration = 0.045, type = 'sine') {
    if (!soundEnabled) return;
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.045, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    } catch (_) {
      soundEnabled = false;
    }
  }

  function sendWs(payload) {
    if (!usesNetwork()) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(payload));
    }
  }

  function updateScore() {
    playerScoreEl.textContent = playerScore;
    cpuScoreEl.textContent = cpuScore;
  }

  function playerWonText(leftWon) {
    return leftWon ? 'NICE PLAY' : 'GAME OVER';
  }

  function syncOverlayAndControls() {
    twoLaptopsButton.classList.toggle('mode-active', twoLaptopsMode);
    twoLaptopsButton.textContent = twoLaptopsMode ? '2 Laptops: ON' : '2 Laptops';
    onlineLaptopsButton.classList.toggle('online-laptop-active', onlineLaptopsMode && !twoLaptopsMode);
    onlineLaptopsButton.textContent = onlineLaptopsMode ? '2 Online Laptops: ON' : '2 Online Laptops';

    if (twoLaptopsMode) {
      statusLabel.textContent = '2 Laptops Local • Left vs Right';
      if (gameOver) {
        const leftWon = playerScore >= WINNING_SCORE;
        overlay.hidden = false;
        overlayKicker.textContent = playerWonText(leftWon);
        overlayTitle.textContent = leftWon ? 'Left wins!' : 'Right takes this one.';
        overlayText.textContent = 'Tap below for another round.';
        overlayButton.disabled = false;
        overlayButton.textContent = 'PLAY AGAIN ↻';
        pauseButton.innerHTML = '↻ Play Again';
        return;
      }
      if (paused) {
        overlay.hidden = false;
        overlayKicker.textContent = '2 LAPTOPS MODE';
        overlayTitle.textContent = 'Ready on both sides.';
        overlayText.textContent = 'Tap below to serve and start.';
        overlayButton.disabled = false;
        overlayButton.textContent = (ball.vx === 0 && ball.vy === 0) ? 'SERVE BALL →' : 'RESUME GAME →';
        pauseButton.innerHTML = '▶ Resume';
      } else {
        overlay.hidden = true;
        pauseButton.innerHTML = '<span class="pause-symbol">Ⅱ</span> Pause';
      }
      return;
    }

    const roleText = side === 'left' ? 'Left Screen' : side === 'right' ? 'Right Screen' : 'Spectator';
    const modePrefix = onlineLaptopsMode ? '2 Online Laptops' : '2-Screen Room';
    statusLabel.textContent = `${modePrefix} • Room ${roomInput.value} (${playersCount}/2) • ${roleText}`;

    if (!matchReady) {
      paused = true;
      overlay.hidden = false;
      overlayKicker.textContent = onlineLaptopsMode ? '2 ONLINE LAPTOPS LOBBY' : 'TWO-SCREEN LOBBY';
      overlayTitle.textContent = `Waiting for Player 2 (${playersCount}/2)…`;
      overlayText.textContent = `Join room ${roomInput.value} on the second screen to start.`;
      overlayButton.disabled = true;
      overlayButton.textContent = 'WAITING FOR PLAYER 2…';
      return;
    }

    if (gameOver) {
      const leftWon = playerScore >= WINNING_SCORE;
      overlay.hidden = false;
      overlayKicker.textContent = playerWonText(leftWon);
      overlayTitle.textContent = leftWon ? 'Left wins!' : 'Right takes this one.';
      overlayText.textContent = 'Tap below for another round.';
      overlayButton.disabled = side === 'spectator';
      overlayButton.textContent = 'PLAY AGAIN ↻';
      pauseButton.innerHTML = '↻ Play Again';
      return;
    }

    if (paused) {
      overlay.hidden = false;
      overlayKicker.textContent = 'GAME PAUSED';
      overlayTitle.textContent = 'Take a breather.';
      overlayText.textContent = 'Tap below when ready.';
      overlayButton.disabled = side === 'spectator';
      overlayButton.textContent = (ball.vx === 0 && ball.vy === 0) ? 'SERVE BALL →' : 'RESUME GAME →';
      pauseButton.innerHTML = '▶ Resume';
    } else {
      overlay.hidden = true;
      pauseButton.innerHTML = '<span class="pause-symbol">Ⅱ</span> Pause';
    }
  }

  function applyServerState(s) {
    if (!s || twoLaptopsMode) return;
    remoteTarget.bx = s.bx;
    remoteTarget.by = s.by;
    ball.vx = s.vx;
    ball.vy = s.vy;
    ball.speed = s.speed;
    pointPause = s.pointPause;
    ball.nextDirection = s.nextDirection;
    if (side !== 'left') {
      remoteTarget.py = s.py;
      player.y = s.py;
    }
    if (side !== 'right') {
      remoteTarget.cy = s.cy;
      cpu.y = s.cy;
    }
    playerScore = s.playerScore;
    cpuScore = s.cpuScore;
    gameOver = s.gameOver;
    if (ball.vx === 0 && ball.vy === 0 && !s.gameOver) {
      ball.x = s.bx;
      ball.y = s.by;
      ball.trail = [];
    }
    updateScore();
    syncOverlayAndControls();
  }

  function requestServe() {
    if (!matchReady || side === 'spectator') return;
    if (twoLaptopsMode) {
      const direction = Math.random() < 0.5 ? -1 : 1;
      ball.x = WIDTH / 2;
      ball.y = HEIGHT / 2;
      ball.speed = 430;
      const angle = (Math.random() * 0.72 - 0.36);
      ball.vx = Math.cos(angle) * ball.speed * direction;
      ball.vy = Math.sin(angle) * ball.speed;
      ball.trail = [];
      paused = false;
      syncOverlayAndControls();
      return;
    }
    sendWs({ type: 'serve' });
  }

  function requestReset() {
    if (!matchReady || side === 'spectator') return;
    if (twoLaptopsMode) {
      resetMatchVisuals();
      requestServe();
      return;
    }
    sendWs({ type: 'reset' });
  }

  function setPaused(value) {
    if (gameOver || !matchReady) return;
    if (twoLaptopsMode) {
      paused = value;
      syncOverlayAndControls();
      return;
    }
    if (side === 'spectator') return;
    sendWs({ type: 'pause', paused: value });
  }

  function scorePointLocal(leftWonPoint) {
    if (leftWonPoint) playerScore++;
    else cpuScore++;
    updateScore();
    playTone(leftWonPoint ? 520 : 300, 0.12);
    if (playerScore >= WINNING_SCORE || cpuScore >= WINNING_SCORE) {
      gameOver = true;
      paused = true;
      ball.vx = 0;
      ball.vy = 0;
      playTone(leftWonPoint ? 660 : 210, 0.22);
      syncOverlayAndControls();
      return;
    }
    pointPause = 0.85;
    ball.x = WIDTH / 2; ball.y = HEIGHT / 2; ball.vx = 0; ball.vy = 0; ball.trail = [];
    ball.nextDirection = leftWonPoint ? 1 : -1;
  }

  function hitPaddleLocal(paddle, direction) {
    const relativeHit = (ball.y - (paddle.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
    const angle = relativeHit * 0.95;
    ball.speed = Math.min(ball.speed + 24, 700);
    ball.vx = Math.cos(angle) * ball.speed * direction;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.x = direction > 0 ? paddle.x + PADDLE_WIDTH + BALL_RADIUS : paddle.x - BALL_RADIUS;
    playTone(420 + Math.abs(relativeHit) * 180, 0.04, 'square');
  }

  function emitPaddle(force = false) {
    if (!usesNetwork()) return;
    const currentY = side === 'left' ? player.y : side === 'right' ? cpu.y : null;
    if (currentY === null) return;
    const now = performance.now();
    if (!force && now - lastPaddleSent < PADDLE_SEND_INTERVAL_MS) return;
    if (!force && lastSentPaddleY !== null && Math.abs(currentY - lastSentPaddleY) < 1.5) return;
    lastPaddleSent = now;
    lastSentPaddleY = currentY;
    sendWs({ type: 'paddle', side, y: currentY });
  }

  function recordTrail() {
    if (TRAIL_LENGTH <= 0) return;
    if (ball.vx !== 0 || ball.vy !== 0) {
      ball.trail.unshift({ x: ball.x, y: ball.y });
      if (ball.trail.length > TRAIL_LENGTH) ball.trail.pop();
    }
  }

  function update(delta) {
    if (usesNetwork()) {
      if (side !== 'left') {
        player.y += (remoteTarget.py - player.y) * 0.4;
      }
      if (side !== 'right') {
        cpu.y += (remoteTarget.cy - cpu.y) * 0.4;
      }
      if (ball.vx !== 0 || ball.vy !== 0) {
        ball.x += ball.vx * delta;
        ball.y += ball.vy * delta;
      }
      ball.x += (remoteTarget.bx - ball.x) * 0.35;
      ball.y += (remoteTarget.by - ball.y) * 0.35;
      recordTrail();
    }

    if (!matchReady || paused) return;

    if (twoLaptopsMode) {
      const leftDir = ((keys.has('s') || keys.has('S')) ? 1 : 0) - ((keys.has('w') || keys.has('W')) ? 1 : 0);
      const rightDir = ((keys.has('ArrowDown')) ? 1 : 0) - ((keys.has('ArrowUp')) ? 1 : 0);
      if (leftDir !== 0) {
        player.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, player.y + leftDir * player.speed * delta));
      }
      if (rightDir !== 0) {
        cpu.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, cpu.y + rightDir * cpu.speed * delta));
      }

      if (pointPause > 0) {
        pointPause -= delta;
        if (pointPause <= 0) requestServe();
        return;
      }

      ball.x += ball.vx * delta;
      ball.y += ball.vy * delta;
      recordTrail();

      if (ball.y - BALL_RADIUS <= 0 && ball.vy < 0) {
        ball.y = BALL_RADIUS; ball.vy *= -1; playTone(260, 0.025);
      } else if (ball.y + BALL_RADIUS >= HEIGHT && ball.vy > 0) {
        ball.y = HEIGHT - BALL_RADIUS; ball.vy *= -1; playTone(260, 0.025);
      }

      if (ball.vx < 0 && ball.x - BALL_RADIUS <= player.x + PADDLE_WIDTH && ball.x > player.x && ball.y + BALL_RADIUS >= player.y && ball.y - BALL_RADIUS <= player.y + PADDLE_HEIGHT) {
        hitPaddleLocal(player, 1);
      } else if (ball.vx > 0 && ball.x + BALL_RADIUS >= cpu.x && ball.x < cpu.x + PADDLE_WIDTH && ball.y + BALL_RADIUS >= cpu.y && ball.y - BALL_RADIUS <= cpu.y + PADDLE_HEIGHT) {
        hitPaddleLocal(cpu, -1);
      }

      if (ball.x < -BALL_RADIUS) scorePointLocal(false);
      else if (ball.x > WIDTH + BALL_RADIUS) scorePointLocal(true);
      return;
    }

    if (side === 'spectator') return;

    if (onlineLaptopsMode) {
      if (side === 'left') {
        const leftKeyDir = ((keys.has('s') || keys.has('S')) ? 1 : 0) - ((keys.has('w') || keys.has('W')) ? 1 : 0);
        const touchDir = (holdDown ? 1 : 0) - (holdUp ? 1 : 0);
        const dirY = leftKeyDir !== 0 ? leftKeyDir : touchDir;
        if (dirY !== 0) {
          player.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, player.y + dirY * player.speed * delta));
          emitPaddle();
        }
      } else if (side === 'right') {
        const rightKeyDir = ((keys.has('ArrowDown')) ? 1 : 0) - ((keys.has('ArrowUp')) ? 1 : 0);
        const touchDir = (holdDown ? 1 : 0) - (holdUp ? 1 : 0);
        const dirY = rightKeyDir !== 0 ? rightKeyDir : touchDir;
        if (dirY !== 0) {
          cpu.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, cpu.y + dirY * cpu.speed * delta));
          emitPaddle();
        }
      }
      return;
    }

    const keyUp = keys.has('ArrowUp') || keys.has('w') || keys.has('W');
    const keyDown = keys.has('ArrowDown') || keys.has('s') || keys.has('S');
    const dirY = ((holdDown || keyDown) ? 1 : 0) - ((holdUp || keyUp) ? 1 : 0);
    if (dirY !== 0) {
      if (side === 'left') {
        player.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, player.y + dirY * player.speed * delta));
        emitPaddle();
      } else if (side === 'right') {
        cpu.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, cpu.y + dirY * cpu.speed * delta));
        emitPaddle();
      }
    }
  }

  function drawPaddle(paddle, color) {
    ctx.fillStyle = color;
    if (lowPower) {
      ctx.fillRect(paddle.x, paddle.y, PADDLE_WIDTH, PADDLE_HEIGHT);
      return;
    }
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, PADDLE_WIDTH, PADDLE_HEIGHT, 6);
    ctx.fill();
  }

  function draw() {
    const full = twoLaptopsMode || viewSelect.value === 'full';
    ctx.save();
    if (full) ctx.scale(0.5, 1);
    else if (side === 'right') ctx.translate(-1000, 0);

    ctx.fillStyle = courtGradient;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    ctx.setLineDash([8, 12]);
    ctx.strokeStyle = '#28334e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(WIDTH / 2, 20);
    ctx.lineTo(WIDTH / 2, HEIGHT - 20);
    ctx.stroke();
    ctx.restore();

    if (!lowPower) {
      ctx.beginPath();
      ctx.arc(WIDTH / 2, HEIGHT / 2, 92, 0, Math.PI * 2);
      ctx.strokeStyle = '#1c2742';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    drawPaddle(player, '#67f5df');
    drawPaddle(cpu, '#ff72ad');

    for (let i = 0; i < ball.trail.length; i++) {
      const point = ball.trail[i];
      ctx.globalAlpha = (1 - i / ball.trail.length) * 0.2;
      ctx.fillStyle = '#f5fbff';
      ctx.beginPath();
      ctx.arc(point.x, point.y, BALL_RADIUS * (1 - i / (ball.trail.length * 1.7)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f5fbff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    if (pointPause > 0 && !paused && !gameOver) {
      ctx.fillStyle = '#8390ad';
      ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('NEXT SERVE', WIDTH / 2, HEIGHT / 2 + 47);
    }
    ctx.restore();
  }

  function frame(time) {
    const delta = Math.min((time - lastFrame) / 1000 || 0, 0.035);
    lastFrame = time;
    update(delta);
    draw();
    requestAnimationFrame(frame);
  }

  function movePaddleByPointer(event) {
    if (!matchReady || paused || side === 'spectator') return;
    const bounds = canvas.getBoundingClientRect();
    const scaleY = HEIGHT / bounds.height;
    const virtualY = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, (event.clientY - bounds.top) * scaleY - PADDLE_HEIGHT / 2));

    if (twoLaptopsMode) {
      const relX = (event.clientX - bounds.left) / bounds.width;
      if (relX < 0.5) player.y = virtualY;
      else cpu.y = virtualY;
      return;
    }

    if (side === 'left') { player.y = virtualY; emitPaddle(); }
    else if (side === 'right') { cpu.y = virtualY; emitPaddle(); }
  }

  function setPseudoFullscreen(active) {
    stage.classList.toggle('pseudo-fs', active);
  }

  function toggleFullscreen() {
    if (stage.classList.contains('pseudo-fs')) {
      setPseudoFullscreen(false);
      return;
    }
    if (document.fullscreenElement) {
      document.exitFullscreen?.().catch(() => {});
      return;
    }
    if (stage.requestFullscreen) {
      stage.requestFullscreen().catch(() => setPseudoFullscreen(true));
    } else {
      setPseudoFullscreen(true);
    }
  }

  function bindHoldButton(btn, setter) {
    const start = (e) => { e.preventDefault(); setter(true); btn.classList.add('active'); };
    const end = () => { setter(false); btn.classList.remove('active'); };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', end);
    btn.addEventListener('pointercancel', end);
    btn.addEventListener('pointerleave', end);
  }

  bindHoldButton(touchUp, (v) => { holdUp = v; });
  bindHoldButton(touchDown, (v) => { holdDown = v; });

  function resetMatchVisuals() {
    playerScore = 0;
    cpuScore = 0;
    gameOver = false;
    pointPause = 0;
    paused = true;
    lastSentPaddleY = null;
    player.y = HEIGHT / 2 - PADDLE_HEIGHT / 2;
    cpu.y = HEIGHT / 2 - PADDLE_HEIGHT / 2;
    ball.x = WIDTH / 2;
    ball.y = HEIGHT / 2;
    ball.vx = 0;
    ball.vy = 0;
    ball.trail = [];
    remoteTarget.py = player.y;
    remoteTarget.cy = cpu.y;
    remoteTarget.bx = ball.x;
    remoteTarget.by = ball.y;
    updateScore();
  }

  function setTwoLaptopsMode(enabled) {
    twoLaptopsMode = enabled;
    if (enabled) onlineLaptopsMode = false;
    resetMatchVisuals();

    if (twoLaptopsMode) {
      matchReady = true;
      if (ws) {
        ws.close();
        ws = null;
      }
      syncOverlayAndControls();
    } else {
      matchReady = false;
      connectRoom();
    }
  }

  function setOnlineLaptopsMode(enabled) {
    onlineLaptopsMode = enabled;
    if (enabled) twoLaptopsMode = false;
    resetMatchVisuals();
    matchReady = false;
    connectRoom();
  }

  function connectRoom() {
    if (!usesNetwork()) return;
    if (ws) ws.close();
    const room = roomInput.value.trim() || '1000';
    roomInput.value = room;
    lastSentPaddleY = null;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws-pong?room=${encodeURIComponent(room)}`);
    ws.onmessage = (event) => {
      if (!usesNetwork()) return;
      const msg = JSON.parse(event.data);
      if (msg.type === 'welcome') {
        side = msg.side;
        playersCount = msg.players;
        matchReady = !!msg.ready;
        if (msg.state) applyServerState(msg.state);
        syncOverlayAndControls();
      } else if (msg.type === 'lobby') {
        playersCount = msg.players;
        matchReady = !!msg.ready;
        if (!matchReady) {
          resetMatchVisuals();
        }
        syncOverlayAndControls();
      } else if (msg.type === 'paddle') {
        if (msg.side === 'left' && side !== 'left') remoteTarget.py = msg.y;
        if (msg.side === 'right' && side !== 'right') remoteTarget.cy = msg.y;
      } else if (msg.type === 'state' && msg.state) {
        const wasPaused = paused;
        paused = !!msg.state.gameOver || (!matchReady);
        if (!matchReady) paused = true;
        else if (msg.state.vx !== 0 || msg.state.vy !== 0 || msg.state.pointPause > 0) {
          if (!wasPaused || !overlay.hidden) paused = false;
        }
        applyServerState(msg.state);
        if (msg.sound) playTone(...msg.sound);
      } else if (msg.type === 'pause') {
        paused = !!msg.paused;
        syncOverlayAndControls();
      }
    };
  }

  window.addEventListener('keydown', (event) => {
    if (['ArrowUp', 'ArrowDown', 'w', 'W', 's', 'S'].includes(event.key)) {
      event.preventDefault();
      keys.add(event.key);
    }
  });
  window.addEventListener('keyup', (event) => {
    keys.delete(event.key);
  });
  window.addEventListener('blur', () => {
    keys.clear();
  });

  canvas.addEventListener('pointerdown', (event) => {
    canvas.setPointerCapture(event.pointerId);
    movePaddleByPointer(event);
  });
  canvas.addEventListener('pointermove', (event) => {
    if (event.pointerType === 'touch' || event.pointerType === 'pen' || event.buttons > 0) {
      movePaddleByPointer(event);
    }
  });

  document.getElementById('joinButton').addEventListener('click', () => {
    if (twoLaptopsMode) setTwoLaptopsMode(false);
    else connectRoom();
  });
  twoLaptopsButton.addEventListener('click', () => setTwoLaptopsMode(!twoLaptopsMode));
  onlineLaptopsButton.addEventListener('click', () => setOnlineLaptopsMode(!onlineLaptopsMode));
  fullscreenButton.addEventListener('click', toggleFullscreen);
  overlayButton.addEventListener('click', () => {
    if (!matchReady || side === 'spectator') return;
    if (gameOver) requestReset();
    else if (ball.vx === 0 && ball.vy === 0) requestServe();
    else setPaused(false);
  });
  pauseButton.addEventListener('click', () => {
    if (!matchReady || side === 'spectator') return;
    if (gameOver) requestReset();
    else setPaused(!paused);
  });
  soundButton.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundButton.classList.toggle('is-muted', !soundEnabled);
    if (soundEnabled) playTone(520, 0.07);
  });

  connectRoom();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
